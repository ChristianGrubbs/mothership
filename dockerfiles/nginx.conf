# TLS may terminate at the ingress proxy before this HTTP listener. Preserve
# its exact HTTP/HTTPS scheme; absent or malformed values use the local scheme.
map $http_x_forwarded_proto $mothership_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

# A web page bundle's URL carries its own capability: the admin grant and the public share
# token are path segments, so writing $request_uri to the access log would persist a working
# credential in plain text for the life of the log. Those two URL families log nothing; every
# other request logs normally.
# $request_uri is the raw (still percent-encoded) URI, so a map on it could be dodged by
# encoding a path byte; instead the two page location blocks below, which nginx matches on the
# decoded, normalised $uri, flip this flag before their internal rewrite. Variables survive
# internal redirects, so the final /index.php location logs nothing for those requests.
map $host $mothership_log {
    default 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # ─── File Uploads (PIM handles large CSV/XLSX imports) ──────────
    client_max_body_size 200M;
    client_body_timeout 600s;

    # ─── Gzip Compression ──────────────────────────────────────────
    gzip on;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/vnd.ms-fontobject
        font/opentype
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_vary on;

    # ─── Dynamic image cache route (Laravel) ─────────────────────
    # Must precede the static-extension rule: /cache/{template}/{filename}
    # produces images via PHP, so it can't be served from disk.
    location ^~ /cache/ {
        try_files $uri /index.php?$query_string;
    }

    # ─── Web page bundles (ADR 0007) ──────────────────────────────
    # Authenticated Laravel routes: the grant/token lives in the path and every sibling
    # (.js, .css, images, fonts) must reach PHP, not the static handlers. nginx takes the
    # first matching regex, so these come before every other regex location (a bundle path
    # may itself contain home/tools/ or end in .css); the share family also matches the
    # slashless /page that Laravel redirects to /page/. The share alternation mirrors the four
    # session-free routes in web-pages.php (page, pg, pf, pgf) with the same segment shapes
    # (pin = asset.attachment.file.64hex, grant = id.64hex): a malformed segment is NOT matched
    # here, so it gains no bypass of the static handlers.
    location ~ ^/(?:[^/]+/)*dam/pages/[0-9]+/g/ {
        set $mothership_log 0;
        rewrite ^ /index.php last;
    }

    # Quoted: an unquoted `{` in the regex quantifier would open the location block.
    location ~ "^/share/[A-Za-z0-9]{20,64}/(?:page|pg/[0-9]{1,12}\.[0-9a-f]{64}|pf/[0-9]{1,18}\.[0-9]{1,18}\.[0-9]{1,18}\.[0-9a-f]{64}|pgf/[0-9]{1,12}\.[0-9a-f]{64}/[0-9]{1,18}\.[0-9]{1,18}\.[0-9]{1,18}\.[0-9a-f]{64})(?:/|$)" {
        set $mothership_log 0;
        rewrite ^ /index.php last;
    }

    # Home widget files and service media are authenticated Laravel routes.
    # Match before static extensions, including a configurable admin prefix.
    location ~ ^/(?:[^/]+/)*home/(tools|service)/ {
        rewrite ^ /index.php last;
    }

    # ─── Static Files (served directly by Nginx) ──────────────────
    # nginx's bundled mime.types may omit ES module files.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf|eot|css|js|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ─── Laravel Front Controller ─────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── PHP-FPM Handler ──────────────────────────────────────────
    location ~ ^/index\.php(/|$) {
        fastcgi_pass mothership-fpm:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Prevent httpoxy vulnerability
        fastcgi_param HTTP_PROXY "";

        # Forward client info to PHP (required for url(), secure(), trusted proxies)
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $mothership_forwarded_proto;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;

        # Buffers for large API responses (product listings, export data)
        fastcgi_buffers 32 32k;
        fastcgi_buffer_size 128k;
        fastcgi_busy_buffers_size 256k;

        # Timeout for long-running requests (imports, exports, bulk ops)
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;

        internal;
    }

    # ─── Accelerated media delivery (X-Accel-Redirect) ───────────────────────
    # PHP authorizes the request and then hands the file to nginx, which serves it
    # with sendfile and native byte-range support. Without this, nginx buffers the
    # whole FastCGI response to a temp file and large videos never start playing.
    # ^~ so the static-extension regex locations cannot intercept an X-Accel internal redirect for .js/.css/images.
    location ^~ /__dam_media/ {
        internal;
        alias /var/www/html/storage/app/private/;
        # Gzip would drop Content-Length and byte ranges on large media.
        gzip off;
        add_header X-Content-Type-Options nosniff always;
    }

    # ─── Remote media delivery (X-Accel-Redirect to an object store, ADR 0017) ──────
    # For a blob on a remote asset disk (S3, MinIO), PHP authorizes the request, signs a short-lived URL
    # and hands it here as /__dam_remote/<scheme>/<host[:port]>/<path>?<signed query>. nginx streams it
    # from the store, so the browser never needs to reach the store (which may be on a private network)
    # and the bytes never pass through PHP. The app sets MOTHERSHIP_REMOTE_ACCEL_PREFIX=/__dam_remote.
    location ^~ /__dam_remote/ {
        internal;

        location ~ ^/__dam_remote/(https?)/(\[[0-9A-Fa-f:.]+\]|[^/:\[\]]+)(:[0-9]+)?/(.+)$ {
            internal;
            set $dam_remote_scheme $1;
            set $dam_remote_host $2;
            set $dam_remote_port $3;
            set $dam_remote_path $4;
            # A proxy_pass built from variables resolves the store's name at request time: Docker's embedded DNS.
            resolver 127.0.0.11 valid=30s ipv6=off;
            proxy_pass $dam_remote_scheme://$dam_remote_host$dam_remote_port/$dam_remote_path$is_args$args;
            # An HTTPS store (S3, R2) picks its certificate by SNI. nginx sends none for a [IPv6] literal.
            proxy_ssl_server_name on;
            proxy_ssl_name $dam_remote_host;
            # The signature covers Host; the browser's cookies and credentials stay here.
            proxy_set_header Host $dam_remote_host$dam_remote_port;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # PHP's Content-Disposition is already on the response; the store's copy would duplicate it.
            proxy_hide_header Content-Disposition;
            proxy_hide_header Set-Cookie;
            # Stream large media as it arrives; gzip would drop Content-Length and byte ranges.
            proxy_buffering off;
            gzip off;
            add_header X-Content-Type-Options nosniff always;
        }

        return 404;
    }

    # ─── Security ─────────────────────────────────────────────────
    # Never serve executable or active HTML content from public uploads.
    location ~* ^/storage/.*\.(php[0-9]?|phtml|pht|phar|html?|shtml|xhtml)$ {
        return 404;
    }

    # Deny direct PHP execution (only index.php is allowed)
    location ~ \.php$ {
        return 404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
    }

    # ─── Logging ──────────────────────────────────────────────────
    access_log /dev/stdout combined if=$mothership_log;
    error_log /dev/stderr notice;
}
