# =============================================================================
# Mothership Apache Override
# =============================================================================
# Replaces Nginx + PHP-FPM with Apache + mod_php (single container).
#
# Usage:
#   docker compose -f compose.dev.yaml -f compose.dev.apache.yaml up -d
#
# Or set in .env:
#   COMPOSE_FILE=compose.dev.yaml:compose.dev.apache.yaml
#
# Database choice is independent of the web server — see COMPOSE_PROFILES
# in compose.dev.yaml.
# =============================================================================

services:
  # Disable Nginx and FPM (replaced by Apache)
  mothership-nginx:
    deploy:
      replicas: 0

  mothership-fpm:
    deploy:
      replicas: 0

  # Apache + PHP (replaces Nginx + FPM)
  mothership-web:
    build:
      context: .
      dockerfile: dockerfiles/web.Dockerfile
    volumes:
      - .:/var/www/html
    ports:
      - "${APP_PORT:-8000}:80"
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-mothership-pgsql}"
      DB_PORT: "${DB_PORT:-5432}"
      REDIS_HOST: mothership-redis
      REDIS_PORT: 6379
      ELASTICSEARCH_HOST: mothership-elasticsearch:9200
      MAIL_HOST: mothership-mailpit
      MAIL_PORT: 1025
    depends_on:
      mothership-pgsql:
        condition: service_healthy
        required: false
      mothership-mysql:
        condition: service_healthy
        required: false
      mothership-redis:
        condition: service_healthy
      mothership-elasticsearch:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
