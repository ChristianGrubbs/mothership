      - name: Install DAM media tools (ExifTool, poppler, libvips, ffmpeg)
        if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        # The FPM, queue and web images carry these (dockerfiles/fpm.Dockerfile); the runner
        # does not. DngPreviewTest shells out to exiftool and vips, PdfThumbnailCleanupTest to
        # pdftoppm, BatchProcessingTest to ffmpeg and ffprobe. One shared lock file, so jobs sharing
        # a host take turns at apt.
        run: |
          if ! command -v exiftool >/dev/null || ! command -v pdftoppm >/dev/null || ! command -v vips >/dev/null || ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo flock /tmp/mothership-ci-libvips.lock sh -ec 'apt-get update && apt-get install -y --no-install-recommends libimage-exiftool-perl poppler-utils libvips-tools ffmpeg'
          fi
          exiftool -ver
          command -v pdftoppm
          vips --version
          ffmpeg -hide_banner -version | head -n 1
          command -v ffprobe

      # HEIC/HEIF previews decode through libvips, installed just above. The explicit probe names a runner without a
      # HEIF reader, and --fail-on-skipped makes any skipped case fail the step: this must run the real decoder.
