  pest-elasticsearch:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","windows-gpu"]') }}
    timeout-minutes: 75
    name: Pest Tests (PostgreSQL + Elasticsearch)
    # 2026-09-16: never on pull requests (a third 75-minute-budget job on every PR push, on a
    # two-runner pool). 2026-10-12: nightly and on workflow_dispatch, like the PostgreSQL leg.
    # A red here is triaged from the nightly run.
    needs: nightly_gate
    if: github.event_name != 'pull_request' && needs.nightly_gate.outputs.run == 'true'
    # PostgreSQL and Elasticsearch are started by a step after the window guard (.github/scripts/ci_service.sh).
    env:
      CI_SVC_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}

    steps:
      # Checkout first so the guard runs from the repository; ci-verify treats steps before the guard
      # as setup (.github/ci-verify.yml).
      - name: Checkout
        uses: actions/checkout@v5

      - name: Nightly window guard (00:00-06:00 America/Chicago)
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          NIGHTLY_INPUT: ${{ inputs.nightly }}
          GITHUB_TOKEN: ${{ github.token }}
          ITEM_KEY: pest-elasticsearch
          ITEM_LABEL: Pest Tests (PostgreSQL + Elasticsearch)
          ITEM_KIND: pest
          ITEM_ADVISORY: 'false'
          MIN_MINUTES: '45'
          JOB_TIMEOUT_MINUTES: '75'
        run: python3 .github/scripts/nightly_guard.py

      - name: Start service containers
        if: steps.guard.outputs.run == 'true'
        env:
          CI_SVC_DEADLINE: ${{ steps.guard.outputs.cut_epoch }}
        run: |
          bash .github/scripts/ci_service.sh start POSTGRES 5432 \
            -e POSTGRES_USER=mothership -e POSTGRES_PASSWORD=mothership -e POSTGRES_DB=mothership \
            --health-cmd="pg_isready -U mothership" --health-interval=5s --health-timeout=3s --health-retries=3 \
            --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=600m --tmpfs /tmp:rw,noexec,nosuid,size=100m \
            postgres:16
          bash .github/scripts/ci_service.sh start ELASTICSEARCH 9200 \
            -e discovery.type=single-node -e xpack.security.enabled=false -e ES_JAVA_OPTS='-Xms256m -Xmx256m' \
            --health-cmd="curl -s http://localhost:9200/_cluster/health || exit 1" \
            --health-interval=10s --health-timeout=5s --health-retries=10 \
            elasticsearch:8.17.0

      - name: Setup PHP
        if: steps.guard.outputs.run == 'true'
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_pgsql, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        if: steps.guard.outputs.run == 'true'
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--optimize-autoloader"

      - name: Setup Node
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Node dependencies
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install Node dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm install --omit=dev --no-audit --no-fund --no-progress --prefer-offline

      - name: Setting Environment
        if: steps.guard.outputs.run == 'true'
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_CONNECTION=\s*\).*$|\1pgsql|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\1${SVC_POSTGRES_PORT}|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1mothership|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1mothership|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1mothership|" .env

      - name: Running Mothership Installer
        if: steps.guard.outputs.run == 'true'
        run: php artisan mothership:install --skip-env-check --skip-admin-creation --with-demo-data

      # mothership:install seeds only the PIM tables; seed the DAM Library root as the SQLite leg does.
      - name: Seed the DAM Library root
        if: steps.guard.outputs.run == 'true'
        run: php artisan db:seed --force --no-interaction --class="Mothership\\DAM\\Database\\Seeders\\DirectoryTableSeeder"

      - name: Enable Elasticsearch and build indexes
        if: steps.guard.outputs.run == 'true'
        run: |
          sed -i "s|^\(ELASTICSEARCH_ENABLED=\s*\).*$|\1true|" .env
          sed -i "s|^\(ELASTICSEARCH_HOST=\s*\).*$|\1http://127.0.0.1:${SVC_ELASTICSEARCH_PORT}|" .env
          sed -i "s|^\(ELASTICSEARCH_INDEX_PREFIX=\s*\).*$|\1mothership_test|" .env
          php artisan config:clear
          curl -s "http://127.0.0.1:${SVC_ELASTICSEARCH_PORT}/_cluster/health" | python3 -m json.tool
          php artisan mothership:product:index
          php artisan mothership:category:index

      - name: Running Pest Tests
        if: steps.guard.outputs.run == 'true'
        # Each worker owns a database clone. The suite runs as two halves so
        # every half starts with fresh workers: per-process memory grows over
        # thousands of tests and a single long run ends with a worker
        # OOM-killed (exit 137), which aborts paratest mid-run.
        run: |
          vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --parallel --processes=3 --colors=always --testsuite "Api Feature Test,Core Unit Test,DataTransfer Unit Test,User Feature Test,Admin Feature Test"
          vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --parallel --processes=3 --colors=always --testsuite "Installer Feature Test,ElasticSearch Feature Test,Completeness Feature Test,Product Unit Test,Product Feature Test,Attribute Unit Test,Category Unit Test,Measurement Feature Test,AiAgent Unit Test,AppUrlGuard Unit Test,Webhook Unit Test,AppUrlGuard Feature Test"

      # Removes this job's service containers whatever happened (success, failure, cancel by the watchdog),
      # ahead of reporting and uploads so a stalled upload cannot use up the cancellation grace first.
      - name: Stop service containers
        if: always()
        env:
          CI_SVC_DEADLINE: ${{ steps.guard.outputs.cut_epoch }}
        run: bash .github/scripts/ci_service.sh stop

      - name: Record nightly totals
        if: always()
        env:
          ITEM_KEY: pest-elasticsearch
          ITEM_LABEL: Pest Tests (PostgreSQL + Elasticsearch)
          ITEM_KIND: pest
          ITEM_ADVISORY: 'false'
          JOB_STATUS: ${{ job.status }}
        run: python3 .github/scripts/nightly_totals.py junit --dir "$RUNNER_TEMP/junit"

      - name: Upload nightly totals
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nightly-totals-pest-elasticsearch
          path: ${{ runner.temp }}/nightly-totals/
          retention-days: 14

  nightly_summary:
    name: Nightly summary
    needs: [nightly_gate, pest, installer, pest-elasticsearch]
    if: always() && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","windows-gpu"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Download nightly totals
        # A run the gate deferred uploaded no totals; the summary still reports every job.
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: nightly-totals-*
          path: nightly-totals
          merge-multiple: true

      - name: Summarize the night
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOTALS_DIR: nightly-totals
          SUMMARY_JOB: Nightly summary
          IGNORE_JOBS: Pest Core (SQLite)
          GATE_JOB: Nightly gate
          GATE_RUN: ${{ needs.nightly_gate.outputs.run }}
          GATE_REASON: ${{ needs.nightly_gate.outputs.reason }}
          GATE_DUPLICATE_OF: ${{ needs.nightly_gate.outputs.duplicate_of }}
        run: python3 .github/scripts/nightly_summary.py

      - name: Upload nightly summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-summary-pest-${{ github.run_id }}
          path: nightly-summary.json
          retention-days: 30
