        # pdftoppm, BatchProcessingTest to ffmpeg and ffprobe. One shared lock file, so jobs sharing
        # a host take turns at apt.
        run: |
          if ! command -v exiftool >/dev/null || ! command -v pdftoppm >/dev/null || ! command -v vips >/dev/null || ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo flock /tmp/mothership-ci-libvips.lock sh -ec 'apt-get update && apt-get install -y --no-install-recommends libimage-exiftool-perl poppler-utils libvips-tools ffmpeg'
          fi
          exiftool -ver
          command -v pdftoppm
          vips --version
          ffmpeg -hide_banner -version | head -n 1
          command -v ffprobe

      # HEIC/HEIF previews decode through libvips, installed just above. The explicit probe names a runner without a
      # HEIF reader, and --fail-on-skipped makes any skipped case fail the step: this must run the real decoder.
      - name: Check HEIC/HEIF previews (real libvips decoder, no skips)
        if: ${{ !cancelled() }}
        run: |
          # grep -c reads the whole listing, so pipefail never sees vips killed by a closed pipe.
          [ "$(vips -l | grep -c heifload)" -gt 0 ] || { echo '::error::libvips has no HEIF reader (heifload) on this runner'; exit 1; }
          # heifload alone proves nothing: HEIC is HEVC, and Ubuntu's libheif ships that decoder as a separate plugin which
          # --no-install-recommends leaves out (windows-gpu-2 WSL: "Unsupported codec (4.3000)"). The probe decodes a committed fixture and checks its pixels.
          if ! bash .github/scripts/heif-hevc-probe.sh; then
            sudo flock /tmp/mothership-ci-libvips.lock sh -ec 'apt-get update && apt-get install -y --no-install-recommends libheif-plugin-libde265'
          fi
          bash .github/scripts/heif-hevc-probe.sh || { echo '::error::libheif cannot decode HEVC (HEIC) on this runner; libheif-plugin-libde265 is missing'; exit 1; }
          vendor/bin/pest --colors=always --fail-on-skipped packages/Mothership/DAM/tests/Feature/HeifPreviewTest.php

