name: Pest Tests

# Pull requests run only the fast SQLite leg, "Pest Core (SQLite)", which also runs
# the DAM test-file gate (.github/scripts/check-dam-test-gate.php). Pushes never
# trigger this workflow, so nothing re-runs on main after a merge.
#
# The slow and optional suites run nightly on main (cron 06:00 UTC, about 01:00
# Central) and on demand: the PostgreSQL and MySQL legs (`pest`), the PostgreSQL +
# Elasticsearch job, and the MariaDB and SQL Server installer legs. Run any of them
# by hand with `gh workflow run pest_tests.yml --ref <branch>`; a dispatch runs all
# of them plus the SQLite leg. A PostgreSQL-only regression is therefore caught the
# next morning, not on its PR: deploy Studio from a main commit whose dispatched
# nightly passed, or after an on-demand dispatch.
#
# 2026-10-29: the real nightly is a `workflow_dispatch` with `nightly=true` sent at 00:05
# America/Chicago by a scheduled job on the operator's Mac (since 2026-10-15).
# GitHub's own `schedule` run still fires, but it is created 5 to 7 hours after the cron (11:17-13:21
# UTC on every night 2026-10-23 to 2026-10-29), so the gate defers it as outside-window and its
# summary is red by design. Read the dispatched "Nightly: Pest Tests" run, not the `schedule` one.
#
# 2026-10-12 operator directive: PRs run fast checks only; slow and optional suites run nightly with a daytime guard.
#
# 2026-10-14 nightly repair: the old guard looked at the clock once, so a job that started late
# "passed" in seconds and one that started at 05:45 ran into the day. Now (same contract as
# playwright_test.yml):
# * Trigger. GitHub's cron was the only trigger (operator decision 2026-10-14: no external timer);
#   the operator replaced it on 2026-10-15 with a dispatch from the Mac (see the 2026-10-29 note
#   above) because the cron fires hours late. A cron run created outside the window is deferred and
#   the nightly summary goes red/deferred: that night has no nightly coverage, reported visibly. A hand dispatch with `nightly: true` gets the
#   same window; a second nightly on one commit defers as a duplicate.
# * Window. The "Nightly gate" job (no services) defers a run created outside 00:00-05:55
#   America/Chicago or duplicating tonight's run. Each leg runs the guard first and starts its
#   database (and Elasticsearch) only after it (.github/scripts/ci_service.sh; no job-level
#   `services:`), so a leg picked up at 05:55 or later, or without enough window left, starts
#   nothing. A running leg's watchdog cancels the run at 05:55.
#   A plain dispatch (nightly unset) and pull requests are unguarded.
# * Evidence. Every leg writes nightly-totals JSON from its JUnit reports, and the always-run
#   "Nightly summary" job reports each leg as executed/passed, executed/failed, deferred,
#   cancelled or not-run, red when a required leg is not executed/passed. The advisory MySQL,
#   MariaDB and SQL Server legs stay listed (a red MySQL leg stays visible) but never turn it red.
# Nightly runs carry a "Nightly:" run-name; the gate's duplicate check reads it (the runs API does
# not expose dispatch inputs), so a plain on-demand dispatch never counts as tonight's nightly.
run-name: "${{ (github.event_name == 'schedule' || inputs.nightly == true) && 'Nightly: Pest Tests' || (github.event.pull_request.title || github.workflow) }}"

on:
  schedule:
    # 06:23 UTC = 01:23 CDT / 00:23 CST: inside the window year-round, off the top of the hour.
    - cron: '23 6 * * *'
  pull_request:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Apply the overnight window, as the cron run does (leave unset for an on-demand run)'
        type: boolean
        default: false

# A PR groups by its head branch and any other event by its ref type and name,
# so a branch's runs share one branch-<name> group whichever event opened them.
# The nightly and a dispatch on main share branch-main. A nightly never cancels an in-progress
# nightly (the later trigger queues, then defers as a duplicate); other runs still replace an
# older run in their group.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && format('branch-{0}', github.head_ref) || format('{0}-{1}', github.ref_type, github.ref_name) }}
  cancel-in-progress: ${{ !(github.event_name == 'schedule' || inputs.nightly == true) }}

# actions: write lets the window watchdog cancel a nightly at 06:00 and the summary read its jobs.
permissions:
  contents: read
  actions: write

# PostgreSQL is the production database (the Studio runtime's `postgres` role,
# tools/studio/runtime.py), so a behaviour that only holds on MySQL (JSON column
# semantics, `->after()`, collation) must not be able to pass here and fail there.
# Its leg is no longer a required check on pull requests (2026-10-12): it runs
# nightly, and the required "Pest Core (SQLite)" leg gates the merge instead. The
# static DAM test-file gate still reads this job's steps (see the SQLite job).
#
# MySQL stays as an advisory compatibility leg, not a gate. The codebase keeps
# Mothership's dual-driver query layer (Mothership\Core GrammarQueryManager, guarded by
# DatabaseDriverCoverageTest) and upstream mothership/mothership merges assume MySQL,
# so drift there is worth seeing; it also carries the `wk_` table-prefix
# coverage. A red MySQL leg is a finding to triage, never a blocker.
#
# 2026-10-09: the MySQL leg and both installer legs skip pull requests. They ran
# on every PR push at about a third of its runner-minutes, on a two-runner pool
# where queue wait, not execution, set the time to merge-ready.
# 2026-10-12: the PostgreSQL leg and the Elasticsearch job join them, so every
# job below except "Pest Core (SQLite)" runs on the nightly schedule and on
# workflow_dispatch only.

jobs:
  nightly_gate:
    # Runs first and starts no service containers: a nightly run that GitHub created outside the
    # 00:00-06:00 America/Chicago window, or that duplicates tonight's earlier run on this commit,
    # is deferred here, so its test jobs are skipped before any database or browser starts.
    name: Nightly gate
    # Pull requests run only the SQLite leg, which does not wait for the gate.
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","windows-gpu"]') }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      reason: ${{ steps.gate.outputs.reason }}
      duplicate_of: ${{ steps.gate.outputs.duplicate_of }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      # Not named like the per-job guard steps (.github/ci-verify.yml guard_steps): this job's
      # decision is its work, so ci-verify counts it as executed.
      - name: Decide whether tonight's run may start
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          NIGHTLY_INPUT: ${{ inputs.nightly }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/nightly_guard.py gate

  pest:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","windows-gpu"]') }}
    timeout-minutes: 75
    name: Pest Tests (${{ matrix.label }})
    continue-on-error: ${{ matrix.advisory }}

    # Nightly and on demand only; a pull request skips this job.
    #
    # The PostgreSQL database is named mothership_test_ci because VectorizationLifecycleTest's
    # two-process race (tools/testing/vectorization-race.php) commits real rows and so refuses
    # any database not named mothership_test_*. This tmpfs service database is exactly that
    # kind of disposable, so it carries the name and the case runs here instead of skipping
    # on every leg.
    needs: nightly_gate
    if: github.event_name != 'pull_request' && needs.nightly_gate.outputs.run == 'true'
    # The database is started by a step after the window guard (.github/scripts/ci_service.sh),
    # not by a job-level `services:` block, which would start it before the guard could defer.
    env:
      CI_SVC_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PostgreSQL
            connection: pgsql
            image: postgres:16
            port: 5432
            database: mothership_test_ci
            username: mothership
            password: mothership
            prefix: ''
            health: pg_isready -U mothership
            data: /var/lib/postgresql/data
            extension: pdo_pgsql
            advisory: false
            # DRAFT window estimates (minutes a leg needs to finish): PostgreSQL measured 64 min on #219.
            min_minutes: 70
          - label: MySQL, advisory
            connection: mysql
            image: mysql:8.0
            port: 3306
            database: mothership
            username: root
            password: root
            prefix: wk_
            health: mysqladmin ping
            data: /var/lib/mysql
            extension: pdo_mysql
            advisory: true
            min_minutes: 45

    steps:
      # Checkout first so the guard runs from the repository; ci-verify treats steps before the guard
      # as setup (.github/ci-verify.yml).
      - name: Checkout
        uses: actions/checkout@v5

      - name: Nightly window guard (00:00-06:00 America/Chicago)
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          NIGHTLY_INPUT: ${{ inputs.nightly }}
          GITHUB_TOKEN: ${{ github.token }}
          ITEM_KEY: pest-${{ matrix.connection }}
          ITEM_LABEL: Pest Tests (${{ matrix.label }})
          ITEM_KIND: pest
          ITEM_ADVISORY: ${{ matrix.advisory }}
          MIN_MINUTES: ${{ matrix.min_minutes }}
          JOB_TIMEOUT_MINUTES: '75'
        run: python3 .github/scripts/nightly_guard.py

      # Each image reads only its own variables, so one env list serves both legs. The host port is
      # Docker's pick, so concurrent jobs on one self-hosted host never collide.
      - name: Start service containers
        if: steps.guard.outputs.run == 'true'
        env:
          CI_SVC_DEADLINE: ${{ steps.guard.outputs.cut_epoch }}
        run: >-
          bash .github/scripts/ci_service.sh start DB ${{ matrix.port }}
          -e POSTGRES_USER=mothership -e POSTGRES_PASSWORD=mothership -e POSTGRES_DB=${{ matrix.database }}
          -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=${{ matrix.database }}
          --health-cmd="${{ matrix.health }}" --health-interval=5s --health-timeout=3s --health-retries=3
          --tmpfs ${{ matrix.data }}:rw,noexec,nosuid,size=600m --tmpfs /tmp:rw,noexec,nosuid,size=100m
          ${{ matrix.image }}

      - name: Setup PHP
        if: steps.guard.outputs.run == 'true'
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          # pcntl + posix: SphereSeamConcurrentImportTest forks a real second process to race two
          # Save-to-DAM imports against PostgreSQL's own row lock — the only way to reproduce the
          # 2026-09-16 production double-submit without a second PHP thread PHP does not have.
          # posix lets the forked child exit via SIGKILL rather than PHP's normal shutdown path,
          # so it never re-runs the parent's own PHPUnit/coverage shutdown handlers a second time.
          extensions: curl, exif, fileinfo, gd, intl, mbstring, openssl, pcntl, pdo, posix, ${{ matrix.extension }}, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        if: steps.guard.outputs.run == 'true'
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--optimize-autoloader"

      - name: Setup Node
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Node dependencies
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install Node dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm install --omit=dev --no-audit --no-fund --no-progress --prefer-offline

      - name: Setting Environment
        if: steps.guard.outputs.run == 'true'
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_CONNECTION=\s*\).*$|\1${{ matrix.connection }}|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\1${SVC_DB_PORT}|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1${{ matrix.database }}|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1${{ matrix.username }}|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1${{ matrix.password }}|" .env
          sed -i "s|^\(DB_PREFIX=\s*\).*$|\1${{ matrix.prefix }}|" .env

      - name: Running Mothership Installer
        if: steps.guard.outputs.run == 'true'
        run: php artisan mothership:install --skip-env-check --skip-admin-creation --with-demo-data

      # mothership:install seeds only the PIM tables; seed the DAM Library root as the SQLite leg does.
      - name: Seed the DAM Library root
        if: steps.guard.outputs.run == 'true'
        run: php artisan db:seed --force --no-interaction --class="Mothership\\DAM\\Database\\Seeders\\DirectoryTableSeeder"

      - name: Running Pest Tests
        if: steps.guard.outputs.run == 'true'
        # Each worker owns a database clone. The suite runs as two halves so
        # every half starts with fresh workers: per-process memory grows over
        # thousands of tests and a single long run ends with a worker
        # OOM-killed (exit 137), which aborts paratest mid-run.
        # The teamcity log streams per-test results, so it survives a crashed
        # worker where a junit report would not.
        run: |
          vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --parallel --processes=3 --colors=always --log-teamcity pest-teamcity-1.log --testsuite "Api Feature Test,Core Unit Test,DataTransfer Unit Test,User Feature Test,Admin Feature Test"
          vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --parallel --processes=3 --colors=always --log-teamcity pest-teamcity-2.log --testsuite "Installer Feature Test,ElasticSearch Feature Test,Completeness Feature Test,Product Unit Test,Product Feature Test,Attribute Unit Test,Category Unit Test,Measurement Feature Test,AiAgent Unit Test,AppUrlGuard Unit Test,Webhook Unit Test,AppUrlGuard Feature Test"

      # 2026-10-01: phpunit.xml's root "Feature" suite (tests/Feature) was in no step of this
      # workflow, so DocumentationRoutesTest's route-inventory check, the guard PR #105 made for
      # docs/api/routes.json, never ran in CI. Run by suite, not by file: every new file under
      # tests/Feature is picked up without a list to maintain. `!cancelled()` so a red step above
      # cannot hide it.
      - name: Check root feature tests (tests/Feature)
        if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always --testsuite Feature

      - name: Check relationship queries
        if: steps.guard.outputs.run == 'true'
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always packages/Mothership/DAM/tests/Feature/AssetRelationshipTest.php

      # Smart search and AI tagging (spec 2026-10-01): schema, codec, fusion, indexing, access leaks.
      - name: Check smart search, AI index and AI tag access
        if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always packages/Mothership/DAM/tests/Unit/AiIndex/VectorCodecTest.php packages/Mothership/DAM/tests/Unit/AiIndex/RrfTest.php packages/Mothership/DAM/tests/Feature/AiIndex/AiIndexSchemaTest.php packages/Mothership/DAM/tests/Feature/AiIndex/AiBridgeClientTest.php packages/Mothership/DAM/tests/Feature/AiIndex/AiIndexAssetJobTest.php packages/Mothership/DAM/tests/Feature/AiIndex/AiIndexTriggersTest.php packages/Mothership/DAM/tests/Feature/AiIndex/SmartSearchTest.php packages/Mothership/DAM/tests/Feature/AiIndex/SmartSearchEmbedCacheTest.php packages/Mothership/DAM/tests/Feature/AiIndex/SmartSearchAccessTest.php packages/Mothership/DAM/tests/Feature/AiIndex/AiIndexReconcileTest.php packages/Mothership/DAM/tests/Feature/AiIndex/AiTagReviewTest.php packages/Mothership/DAM/tests/Feature/AiIndex/AiDescribeAndRenameTest.php packages/Mothership/DAM/tests/Feature/AiIndex/AiEligibilityTest.php packages/Mothership/DAM/tests/Feature/AiIndex/MemberDescriptionsTest.php packages/Mothership/DAM/tests/Feature/AiIndex/FindSimilarTest.php packages/Mothership/DAM/tests/Feature/AiIndex/SmartSearchPostgresTest.php

      # phpunit.xml has no "DAM Feature Test"/"DAM Unit Test" entry in the suites this workflow
      # runs, so these two files executed nowhere: the folder-move authorization rules and the move
      # job's failure reporting could regress with every check green.
      #
      # `!cancelled()` because these files are independent of the big suite above. Without it a red
      # "Running Pest Tests" skips this step, and a check that only runs when everything else is
      # already green reports nothing on exactly the runs where it would be read.
      - name: Check directory move authorization and the move job failure path
        if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always packages/Mothership/DAM/tests/Feature/DirectoryMoveTest.php packages/Mothership/DAM/tests/Unit/JobsTest.php

      # Same guard as the directory-move step: an unrelated failure in "Running Pest Tests" must
      # not hide whether the Home and QuickView behavior passed.
      - name: Check authenticated Transfers grants
        if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        run: vendor/bin/pest packages/Mothership/DAM/tests/Feature/TransfersTest.php

      - name: Check Home widgets and StylePress generation
        if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always packages/Mothership/DAM/tests/Feature/HomeTest.php packages/Mothership/DAM/tests/Feature/HomeSummaryTest.php packages/Mothership/DAM/tests/Feature/SignalAlertsTest.php packages/Mothership/DAM/tests/Feature/HomeRecentTypeLabelTest.php packages/Mothership/DAM/tests/Feature/HomeSystemQuickViewTest.php packages/Mothership/DAM/tests/Feature/HomeSystemQuickViewMigrationTest.php packages/Mothership/DAM/tests/Feature/StylePressWidgetTest.php packages/Mothership/DAM/tests/Feature/GenerationTitlerTest.php packages/Mothership/DAM/tests/Feature/GenerationPackageTest.php packages/Mothership/DAM/tests/Feature/StylePressCatalogTest.php packages/Mothership/DAM/tests/Feature/StylePressThumbnailDerivativesTest.php

      # Same gap as the directory-move step above (phpunit.xml has no "DAM Feature Test" entry in
      # the suites this workflow runs). Audited against every Pest file the 2026-09-16 batch of
      # merged PRs added or changed since 24f82bdd: none of these were ever named in any step here
      # either, so none had ever once executed in CI despite every check on their PRs going green —
      # SphereSeam save/resolution and its review rounds (#175), asset neighbour navigation and
      # asset details (#177), client-side model thumbnail capture (#176), the custom-thumbnail
      # flow (#179).
      #
      # AssetInfoTest.php stayed out of this list on 2026-09-16 (its one red case asserted
      # outdated card markup); repaired 2026-09-17, it runs in the last
      # step of this job with the rest of that baseline.
      #
      # SphereSeamConcurrentImportTest runs first on purpose (2026-09-23): it commits real rows, so
      # if its cleanup ever leaks the root-level exports folder again, SphereSeamTest's "reuses an
      # existing root-level exports folder" fails here instead of only in a filename-order local run.
      - name: Check batch DAM feature tests (2026-09-16 merges, never previously run in CI)
        if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always packages/Mothership/DAM/tests/Feature/SphereSeamConcurrentImportTest.php packages/Mothership/DAM/tests/Feature/SphereSeamTest.php packages/Mothership/DAM/tests/Feature/SharedHiggsfieldTest.php packages/Mothership/DAM/tests/Feature/SharedHiggsfieldQueueLifecycleTest.php packages/Mothership/DAM/tests/Feature/BlobLockRaceTest.php packages/Mothership/DAM/tests/Feature/AssetNeighboursTest.php packages/Mothership/DAM/tests/Feature/AssetTest.php packages/Mothership/DAM/tests/Feature/AssetHiddenEqualsMissingTest.php packages/Mothership/DAM/tests/Feature/AssetAccessDecisionTest.php packages/Mothership/DAM/tests/Feature/RouteInventoryTest.php packages/Mothership/DAM/tests/Feature/DirectoryHiddenEqualsMissingTest.php packages/Mothership/DAM/tests/Feature/ModelThumbnailCaptureTest.php packages/Mothership/DAM/tests/Feature/Api/ModelThumbnailApiTest.php packages/Mothership/DAM/tests/Feature/ModelFileThumbnailTest.php packages/Mothership/DAM/tests/Feature/StackFileThumbnailTest.php packages/Mothership/DAM/tests/Feature/AdobeFormatsTest.php packages/Mothership/DAM/tests/Feature/CustomThumbnailTest.php packages/Mothership/DAM/tests/Feature/PlaceholderThumbnailEtagTest.php packages/Mothership/DAM/tests/Feature/StackMemberThumbnailVersionTest.php

      # 2026-10-08: two-connection races on PostgreSQL row locks (a forked process holds a second session).
      # They commit real rows and clean them up, so they run in their own step like SphereSeamConcurrentImportTest.
      #
      # Admission is proved, not declared (tests/Support/TestTargetGuard.php, CI mode). Before the race tests the
      # guard's own connection-free tests run, then .github/scripts/ci-pg-proof.sh derives a private proof (mode 0600,
      # under RUNNER_TEMP) from THIS job's service container: container id, run id and attempt, workspace, the
      # Docker-allocated host port for 5432, the tmpfs mount on the data directory, and the running postmaster's start
      # time and system identifier. Its SHA-256 travels separately in the environment. The application admits the target
      # before any provider boots and again at every connection; a missing or different fact refuses, never skips.
      # --fail-on-skipped makes any skipped case fail the step. Only the PostgreSQL leg: the MySQL leg has no such service.
      - name: Check manual/machine write races, mapping totals and organization name locks (PostgreSQL row locks)
        if: matrix.connection == 'pgsql' && steps.guard.outputs.run == 'true'
        env:
          MOTHERSHIP_CI_SERVICE_ID: ${{ env.SVC_DB_ID }}
          MOTHERSHIP_CI_SERVICE_PORT: ${{ env.SVC_DB_PORT }}
          MOTHERSHIP_CI_DB_USER: ${{ matrix.username }}
        run: |
          vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php --do-not-cache-result tests/Guard
          php tests/Guard/pure-harness.php
          # The guarded lane never generates the OAuth test keys; create them now, before the guard variables exist.
          php tests/bootstrap.php
          MOTHERSHIP_CI_PROOF_SHA256="$(bash .github/scripts/ci-pg-proof.sh)"
          export MOTHERSHIP_CI_PROOF_SHA256
          export MOTHERSHIP_CI_PROOF="$(cd "$RUNNER_TEMP" && pwd -P)/mothership-ci-pg-proof.json"
          export MOTHERSHIP_REQUIRE_TARGET_GUARD=1
          vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always --fail-on-skipped packages/Mothership/DAM/tests/Feature/AutomationManualWriteRacePostgresTest.php packages/Mothership/DAM/tests/Feature/MappingChunkCountsRacePostgresTest.php packages/Mothership/DAM/tests/Feature/AdminInvariantRacePostgresTest.php packages/Mothership/DAM/tests/Feature/AssetNameRacePostgresTest.php packages/Mothership/DAM/tests/Feature/OrganizationNameRacePostgresTest.php packages/Mothership/DAM/tests/Feature/AiIndex/MemberDescriptionsLockCommittedTest.php packages/Mothership/DAM/tests/Feature/StackReorderDeadlockTest.php

      # 2026-10-10: the organization name lock under REPEATABLE READ (UX eval rev-J3). A request inside an outer
      # transaction takes its snapshot, waits for the scope lock while a second session commits a name, and its
      # uniqueness check must still see that name (locking reads); a holder that outlasts dam.organize.lock_wait
      # gives 409 even though Laravel wraps the driver's lock wait timeout in a DeadlockException there. It needs
      # MySQL's REPEATABLE READ, so it runs only on the MySQL leg, mirroring the PostgreSQL race step above;
      # --fail-on-skipped makes a skip there fail. It commits real rows and removes them itself. The leg is advisory
      # and skips pull requests (see the note above `jobs:`).
      - name: Check the organization name lock under REPEATABLE READ (MySQL)
        if: matrix.connection == 'mysql' && steps.guard.outputs.run == 'true'
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always --fail-on-skipped packages/Mothership/DAM/tests/Feature/OrganizationNameSnapshotMysqlTest.php

      # 2026-10-10: the organization name lock's driver-neutral cases (lock timeout mapping, the transaction a timeout
      # leaves behind). They run on every leg; the two-connection proofs are the steps around this one.
      - name: Check the organization name lock (timeout and transaction handling)
        if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always packages/Mothership/DAM/tests/Feature/OrganizationNameLockTest.php packages/Mothership/DAM/tests/Feature/OrganizationNameLockTransactionTest.php

      # The merge gate runs on PostgreSQL, so the gate guard (check-dam-test-gate.php) counts a file only when a step
      # on that leg names it. This lists the REPEATABLE READ test there; its setUp skips every driver but
      # MySQL/MariaDB before any query. No --fail-on-skipped here: the skip is the expected result on PostgreSQL.
      - name: List the organization name REPEATABLE READ test on the gate leg (skips on PostgreSQL)
