        if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        run: |
          # grep -c reads the whole listing, so pipefail never sees vips killed by a closed pipe.
          [ "$(vips -l | grep -c heifload)" -gt 0 ] || { echo '::error::libvips has no HEIF reader (heifload) on this runner'; exit 1; }
          # heifload alone proves nothing: HEIC is HEVC, and Ubuntu's libheif ships that decoder as a separate plugin which
          # --no-install-recommends leaves out (windows-gpu-2 WSL: "Unsupported codec (4.3000)"). The probe decodes a committed fixture and checks its pixels.
          if ! bash .github/scripts/heif-hevc-probe.sh; then
            sudo flock /tmp/mothership-ci-libvips.lock sh -ec 'apt-get update && apt-get install -y --no-install-recommends libheif-plugin-libde265'
          fi
          bash .github/scripts/heif-hevc-probe.sh || { echo '::error::libheif cannot decode HEVC (HEIC) on this runner; libheif-plugin-libde265 is missing'; exit 1; }
          vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always --fail-on-skipped packages/Mothership/DAM/tests/Feature/HeifPreviewTest.php

      # 2026-09-17: the last eight files of the 2026-09-16 baseline, each of which failed on its
      # own: five stale or environment-bound tests repaired, one case that skips outside the
      # disposable PostgreSQL database its race script insists on, and two that need the media
      # tools installed just above.
      - name: Check the last DAM tests off the 2026-09-16 baseline
        if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always packages/Mothership/DAM/tests/Feature/AssetDisplayNameTest.php packages/Mothership/DAM/tests/Feature/CompoundAssetObserverTest.php packages/Mothership/DAM/tests/Feature/AssetInfoTest.php packages/Mothership/DAM/tests/Feature/DamUpdaterBackupTest.php packages/Mothership/DAM/tests/Feature/DngPreviewTest.php packages/Mothership/DAM/tests/Feature/PdfThumbnailCleanupTest.php packages/Mothership/DAM/tests/Feature/ReadSeamAcceptanceTest.php packages/Mothership/DAM/tests/Feature/VectorizationLifecycleTest.php packages/Mothership/DAM/tests/Unit/AssetDataGridPrefixTest.php packages/Mothership/DAM/tests/Feature/StorageWriteSeamTest.php packages/Mothership/DAM/tests/Feature/ExplorerCopyAssetTest.php packages/Mothership/DAM/tests/Feature/FoldersAreMetadataAcceptanceTest.php packages/Mothership/DAM/tests/Feature/EditorResourcesAreBlobsAcceptanceTest.php packages/Mothership/DAM/tests/Feature/BatchProcessingTest.php packages/Mothership/DAM/tests/Feature/AssetShowQueryBudgetTest.php

      # Its own step, after the media tools: the over-budget case shells out to ffmpeg.
      - name: Check AI index image sampling (large rasters scale out of process)
        if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always packages/Mothership/DAM/tests/Feature/AiIndex/MediaSamplerRasterTest.php

      - name: Check stack member metadata, naming and filter recovery
        if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always packages/Mothership/DAM/tests/Feature/StackMemberMetadataTest.php packages/Mothership/DAM/tests/Feature/AiIndex/StackMemberRenameTest.php packages/Mothership/DAM/tests/Feature/ExplorerFilterRecoveryTest.php

      # The details layout outputs only the active tab's slot, so the shared lightbox Files "Open" needs
      # must be emitted by the tab that is showing (server-rendered markup count on each tab).
      - name: Check Files tab shared viewer mount
        if: ${{ !cancelled() && steps.guard.outputs.run == 'true' }}
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always packages/Mothership/DAM/tests/Feature/AssetFilesViewerMountTest.php

      # Not a regression gate: prints one JSON line of measured timing to the job log as
      # perf evidence for the StylePress thumbnail perf PR. Runs on the PostgreSQL leg only,
      # which is the merge gate; the real 148-image catalog lives at
      # packages/Mothership/DAM/src/Resources/widgets/stylepress/assets/stylepress.
      - name: Benchmark StylePress thumbnail requests (CI evidence, not a gate)
        if: matrix.connection == 'pgsql' && steps.guard.outputs.run == 'true'
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always packages/Mothership/DAM/tests/Feature/StylePressThumbnailBenchmarkTest.php

      - name: Check image editor document lifecycle
        if: matrix.connection == 'pgsql' && steps.guard.outputs.run == 'true'
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always packages/Mothership/DAM/tests/Feature/ImageEditorDocumentTest.php packages/Mothership/DAM/tests/Feature/ImageEditorSchemaV2Test.php packages/Mothership/DAM/tests/Feature/ImageEditingCapabilityTest.php

      - name: Check Hub resources and Feedback
        if: matrix.connection == 'pgsql' && steps.guard.outputs.run == 'true'
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always packages/Mothership/DAM/tests/Feature/CreativeHub/HubResourceInspectorTest.php packages/Mothership/DAM/tests/Feature/CreativeHub/HubResourceStoreTest.php packages/Mothership/DAM/tests/Feature/CreativeHub/HubResourceAccessTest.php packages/Mothership/DAM/tests/Feature/CreativeHub/HubResourceUploadTest.php packages/Mothership/DAM/tests/Feature/CreativeHub/HubResourcePageTest.php packages/Mothership/DAM/tests/Feature/Feedback/FeedbackReportTest.php packages/Mothership/DAM/tests/Feature/Feedback/FeedbackUiTest.php packages/Mothership/DAM/tests/Feature/Feedback/FeedbackTriageTest.php

      # Removes this job's service containers whatever happened (success, failure, cancel by the watchdog),
      # ahead of reporting and uploads so a stalled upload cannot use up the cancellation grace first.
      - name: Stop service containers
        if: always()
        env:
          CI_SVC_DEADLINE: ${{ steps.guard.outputs.cut_epoch }}
        run: bash .github/scripts/ci_service.sh stop

      - name: Upload failure report
        if: failure() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pest-${{ matrix.connection }}-teamcity
          path: pest-teamcity-*.log
          if-no-files-found: ignore

      - name: Record nightly totals
        if: always()
        env:
          ITEM_KEY: pest-${{ matrix.connection }}
          ITEM_LABEL: Pest Tests (${{ matrix.label }})
          ITEM_KIND: pest
          ITEM_ADVISORY: ${{ matrix.advisory }}
          JOB_STATUS: ${{ job.status }}
        run: python3 .github/scripts/nightly_totals.py junit --dir "$RUNNER_TEMP/junit"

      - name: Upload nightly totals
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nightly-totals-pest-${{ matrix.connection }}
          path: ${{ runner.temp }}/nightly-totals/
          retention-days: 14

  # The installer offers four drivers (Installer::DATABASE_DRIVERS: mysql, mariadb, pgsql,
  # sqlsrv), but the legs above only ever build a schema on PostgreSQL, MySQL and SQLite, so a
  # grammar gap on the other two landed unseen: Laravel's SqlServerGrammar has no insertOrIgnore
  # compiler, which a review of PR #36 caught by reading the code, not by running it (2026-09-23).
  # These legs run the installer only, with no test suite on top: they answer "does a fresh
  # install finish on this driver". Both are advisory, and a red leg is a finding to triage,
  # never a blocker. Like the MySQL leg they skip pull requests and run nightly and on demand (see the note above `jobs:`).
  installer:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","windows-gpu"]') }}
    timeout-minutes: 30
    name: Installer (${{ matrix.label }})
    needs: nightly_gate
    if: github.event_name != 'pull_request' && needs.nightly_gate.outputs.run == 'true'
    continue-on-error: ${{ matrix.advisory }}
    # The database is started by a step after the window guard (.github/scripts/ci_service.sh).
    env:
      CI_SVC_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: MariaDB, advisory
            connection: mariadb
            image: mariadb:11.4
            port: 3306
            database: mothership
            username: root
            password: root
            # healthcheck.sh ships in the image; MariaDB 11 images no longer carry the
            # mysql-named client binaries the MySQL leg's `mysqladmin ping` relies on.
            options: >-
              --health-cmd="healthcheck.sh --connect --innodb_initialized"
              --health-interval=5s
              --health-timeout=3s
              --health-retries=6
              --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=600m
            extension: pdo_mysql
            advisory: true
            min_minutes: 15
          - label: SQL Server, advisory
            connection: sqlsrv
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: 1433
            database: mothership
            username: sa
            # SQL Server refuses an SA password without three character classes.
            password: Mothership-ci-1
            # No tmpfs (SQL Server opens its files with O_DIRECT, which tmpfs rejects) and no
            # health check: the image's sqlcmd path has moved between releases, so the
            # "Create the SQL Server database" step polls for readiness through PHP instead.
            # The cap is headroom over MSSQL_MEMORY_LIMIT_MB below, on a 12 GB WSL VM that also
            # hosts the pest job's database.
            options: --memory=3g
            extension: sqlsrv, pdo_sqlsrv
            advisory: true
            min_minutes: 20

    steps:
      # Checkout first so the guard runs from the repository; ci-verify treats steps before the guard
      # as setup (.github/ci-verify.yml).
      - name: Checkout
        uses: actions/checkout@v5

      - name: Nightly window guard (00:00-06:00 America/Chicago)
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          NIGHTLY_INPUT: ${{ inputs.nightly }}
          GITHUB_TOKEN: ${{ github.token }}
          ITEM_KEY: installer-${{ matrix.connection }}
          ITEM_LABEL: Installer (${{ matrix.label }})
          ITEM_KIND: installer
          ITEM_ADVISORY: ${{ matrix.advisory }}
          MIN_MINUTES: ${{ matrix.min_minutes }}
          JOB_TIMEOUT_MINUTES: '30'
        run: python3 .github/scripts/nightly_guard.py

      # Each image reads only its own variables, so one env list serves both legs.
      - name: Start service containers
        if: steps.guard.outputs.run == 'true'
        env:
          CI_SVC_DEADLINE: ${{ steps.guard.outputs.cut_epoch }}
        run: >-
          bash .github/scripts/ci_service.sh start DB ${{ matrix.port }}
          -e MARIADB_ROOT_PASSWORD=${{ matrix.password }} -e MARIADB_DATABASE=${{ matrix.database }}
          -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=${{ matrix.password }} -e MSSQL_MEMORY_LIMIT_MB=2048
          ${{ matrix.options }}
          ${{ matrix.image }}

      - name: Setup PHP
        if: steps.guard.outputs.run == 'true'
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, ${{ matrix.extension }}, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      # On this pool setup-php enables prebuilt sqlsrv/pdo_sqlsrv but does not install the
      # Microsoft ODBC driver they load at connect time (first run, 2026-09-23: SQLSTATE[IMSSP]
      # "requires the Microsoft ODBC Driver"). Installed once per runner host from Microsoft's
      # apt repository; the lock file makes jobs sharing a host take turns at apt.
      - name: Install the Microsoft ODBC driver
        if: matrix.connection == 'sqlsrv' && steps.guard.outputs.run == 'true'
        run: |
          if ! odbcinst -q -d -n "ODBC Driver 18 for SQL Server" >/dev/null 2>&1; then
            sudo flock /tmp/mothership-ci-msodbcsql.lock sh -ec '
              . /etc/os-release
              deb="$(mktemp --suffix=.deb)"
              curl -fsSL -o "$deb" "https://packages.microsoft.com/config/ubuntu/$VERSION_ID/packages-microsoft-prod.deb"
              dpkg -i "$deb"
              rm -f "$deb"
              apt-get update
              ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18 unixodbc
            '
          fi
          odbcinst -q -d -n "ODBC Driver 18 for SQL Server"

      - name: Install Composer dependencies
        if: steps.guard.outputs.run == 'true'
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--optimize-autoloader"

      - name: Setting Environment
        if: steps.guard.outputs.run == 'true'
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_CONNECTION=\s*\).*$|\1${{ matrix.connection }}|" .env
          sed -i "s|^\(DB_HOST=\s*\).*$|\1127.0.0.1|" .env
          sed -i "s|^\(DB_PORT=\s*\).*$|\1${SVC_DB_PORT}|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1${{ matrix.database }}|" .env
          sed -i "s|^\(DB_USERNAME=\s*\).*$|\1${{ matrix.username }}|" .env
          sed -i "s|^\(DB_PASSWORD=\s*\).*$|\1${{ matrix.password }}|" .env
          # Read only by the sqlsrv connection (config/database.php): the container's
          # certificate is self-signed and ODBC Driver 18 encrypts by default.
          echo "DB_TRUST_SERVER_CERTIFICATE=true" >> .env
          php artisan key:generate --force --no-interaction

      # The SQL Server image creates no application database, and it takes a while to accept
      # logins after the container starts, so wait for a login, then create the database.
      - name: Create the SQL Server database
        if: matrix.connection == 'sqlsrv' && steps.guard.outputs.run == 'true'
        env:
          DB_PORT: ${{ env.SVC_DB_PORT }}
          DB_DATABASE: ${{ matrix.database }}
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: ${{ matrix.password }}
        run: |
          php -r '
            $dsn = "sqlsrv:Server=127.0.0.1,".getenv("DB_PORT").";TrustServerCertificate=1";
            for ($i = 1; ; $i++) {
                try { $pdo = new PDO($dsn, getenv("DB_USERNAME"), getenv("DB_PASSWORD")); break; }
                catch (PDOException $e) { if ($i >= 60) throw $e; fwrite(STDERR, "waiting for SQL Server ($i)\n"); sleep(2); }
            }
            $pdo->exec("CREATE DATABASE [".getenv("DB_DATABASE")."]");
            echo "created ".getenv("DB_DATABASE"), PHP_EOL;
          '

      # Every migration from an empty database, on its own so a schema failure reads apart from
      # a seeding failure in the installer step that follows.
      - name: Migrate from empty
        if: steps.guard.outputs.run == 'true'
        run: php artisan migrate:fresh --force --no-interaction

      - name: Running Mothership Installer
        if: steps.guard.outputs.run == 'true'
        run: php artisan mothership:install --skip-env-check --skip-admin-creation --with-demo-data

      - name: Seed the DAM Library root
        if: steps.guard.outputs.run == 'true'
        run: php artisan db:seed --force --no-interaction --class="Mothership\\DAM\\Database\\Seeders\\DirectoryTableSeeder"

      # dam_optimizations.asset_file_id is NO ACTION on SQL Server (error 1785), so the app clears
      # it before a file or asset goes; only a real server shows whether those deletes succeed.
      - name: Check optimization links clear on file and asset delete
        if: steps.guard.outputs.run == 'true'
        run: vendor/bin/pest --log-junit "$RUNNER_TEMP/junit/${GITHUB_ACTION}-${RANDOM}.xml" --colors=always packages/Mothership/DAM/tests/Feature/AssetOptimizationTest.php --filter="clears the optimization link"

  # Migrations branch on SQLite, which no other leg runs. Core Unit holds the
  # migration and grammar tests, so it runs here against a SQLite file. The
  # installer only accepts server drivers, so the schema is built by hand:
  # migrate, seed, then the DAM directories.

      # Removes this job's service containers whatever happened (success, failure, cancel by the watchdog),
      # ahead of reporting and uploads so a stalled upload cannot use up the cancellation grace first.
      - name: Stop service containers
        if: always()
        env:
          CI_SVC_DEADLINE: ${{ steps.guard.outputs.cut_epoch }}
        run: bash .github/scripts/ci_service.sh stop

      - name: Record nightly totals
        if: always()
        env:
          ITEM_KEY: installer-${{ matrix.connection }}
          ITEM_LABEL: Installer (${{ matrix.label }})
          ITEM_KIND: installer
          ITEM_ADVISORY: ${{ matrix.advisory }}
          JOB_STATUS: ${{ job.status }}
        run: python3 .github/scripts/nightly_totals.py junit --dir "$RUNNER_TEMP/junit"

      - name: Upload nightly totals
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nightly-totals-installer-${{ matrix.connection }}
          path: ${{ runner.temp }}/nightly-totals/
          retention-days: 14

  pest-sqlite:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","x64","windows-gpu"]') }}
    timeout-minutes: 75
    name: Pest Core (SQLite)
    # The only job a pull request runs. The nightly skips it: the other jobs are the slow legs,
    # and a PR already tested this one. A dispatch still runs it.
    if: github.event_name != 'schedule' && inputs.nightly != true

    env:
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          extensions: curl, exif, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--optimize-autoloader"

      # DAM tests run in this workflow only when a step names the file: phpunit's "DAM Feature
      # Test" suite is not among the suites it runs. That let every new Pest file from the
      # 2026-09-16 batch merge green without ever executing, and 126 of 148 files had never run
      # here at all. This step fails when a DAM test file is not named on a Pest line of the
      # `pest` job, the merge gate. The dated baseline that carried the 126
      # (.github/dam-tests-not-in-ci.txt) was worked to zero on 2026-09-17 and is gone: there is
      # no list to add a file to, only a step. The SQLite job below names most of the same files
      # for a second signal but is not checked; some steps are PostgreSQL-only by design.
      # It parses the workflow as YAML (symfony/yaml, hence after Composer) and credits a file
      # only as an argument of a required-leg `vendor/bin/pest` command; see the script header.
      # Comments, step names and `true # vendor/bin/pest …` decoys counted under the earlier
      # grep (to 2026-10-01). --self-test first proves the decoys still do not count.
      - name: Setting Environment
        run: |
          cp .env.example .env
          sed -i "s|^\(APP_ENV=\s*\).*$|\1testing|" .env
          sed -i "s|^\(DB_CONNECTION=\s*\).*$|\1sqlite|" .env
          sed -i "s|^\(DB_DATABASE=\s*\).*$|\1$DB_DATABASE|" .env
          touch "$DB_DATABASE"
          php artisan key:generate --force --no-interaction

      - name: Building the schema
        run: |
          php artisan migrate --force --no-interaction
          php artisan db:seed --force --no-interaction
          php artisan db:seed --force --no-interaction --class="Mothership\\DAM\\Database\\Seeders\\DirectoryTableSeeder"

      - name: Every DAM test file is named in the gate job
        run: |
          php .github/scripts/check-dam-test-gate.php --self-test
          php .github/scripts/check-dam-test-gate.php

      - name: Check authenticated Transfers grants
        run: vendor/bin/pest packages/Mothership/DAM/tests/Feature/TransfersTest.php

      - name: Running Core tests
        run: vendor/bin/pest --colors=always --testsuite "Core Unit Test"

      # Mirror of the gate job's root-suite step, for a SQLite signal of its own.
      - name: Check root feature tests (tests/Feature)
        if: ${{ !cancelled() }}
        run: vendor/bin/pest --colors=always --testsuite Feature

      - name: Check relationship queries
        run: vendor/bin/pest --colors=always packages/Mothership/DAM/tests/Feature/AssetRelationshipTest.php

      # The PostgreSQL legs are the gate but have been red for reasons of their own, so this leg is
      # where the directory-move rules get a green-to-red signal of their own.
      - name: Check directory move authorization and the move job failure path
        if: '!cancelled()'
        run: vendor/bin/pest --colors=always packages/Mothership/DAM/tests/Feature/DirectoryMoveTest.php packages/Mothership/DAM/tests/Unit/JobsTest.php

      # Same coverage gap, same batch of files, run here too for the same green-to-red signal
      # independent of the PostgreSQL legs' own unrelated redness. SphereSeamConcurrentImportTest
      # forks a real process to race PostgreSQL's own row lock and skips itself on every other
      # driver (including this SQLite leg), so pcntl/posix are deliberately not added to this
      # job's extensions — nothing here needs them.
      - name: Check batch DAM feature tests (2026-09-16 merges, never previously run in CI)
        if: ${{ !cancelled() }}
        run: vendor/bin/pest --colors=always packages/Mothership/DAM/tests/Feature/SphereSeamTest.php packages/Mothership/DAM/tests/Feature/SharedHiggsfieldTest.php packages/Mothership/DAM/tests/Feature/SharedHiggsfieldQueueLifecycleTest.php packages/Mothership/DAM/tests/Feature/SphereSeamConcurrentImportTest.php packages/Mothership/DAM/tests/Feature/AssetNeighboursTest.php packages/Mothership/DAM/tests/Feature/AssetTest.php packages/Mothership/DAM/tests/Feature/AssetHiddenEqualsMissingTest.php packages/Mothership/DAM/tests/Feature/AssetAccessDecisionTest.php packages/Mothership/DAM/tests/Feature/RouteInventoryTest.php packages/Mothership/DAM/tests/Feature/DirectoryHiddenEqualsMissingTest.php packages/Mothership/DAM/tests/Feature/ModelThumbnailCaptureTest.php packages/Mothership/DAM/tests/Feature/Api/ModelThumbnailApiTest.php packages/Mothership/DAM/tests/Feature/CustomThumbnailTest.php packages/Mothership/DAM/tests/Feature/PlaceholderThumbnailEtagTest.php packages/Mothership/DAM/tests/Feature/StackMemberThumbnailVersionTest.php

      # Every case here authenticates through a Passport client, which no SQLite schema could
      # create until AdminApi migration 2026_09_16_100000 (oauth_clients.id integer rowid -> uuid);
      # this step is that migration's regression check.
      - name: Check DAM API feature tests
        if: ${{ !cancelled() }}
        run: vendor/bin/pest --colors=always packages/Mothership/DAM/tests/Feature/Api/AssetApiTest.php packages/Mothership/DAM/tests/Feature/Api/AssetRelationshipApiTest.php packages/Mothership/DAM/tests/Feature/Api/CommentApiTest.php packages/Mothership/DAM/tests/Feature/Api/DirectoryApiTest.php packages/Mothership/DAM/tests/Feature/Api/LinkedResourcesApiTest.php packages/Mothership/DAM/tests/Feature/Api/PropertyApiTest.php packages/Mothership/DAM/tests/Feature/Api/ReorganizeApiTest.php packages/Mothership/DAM/tests/Feature/Api/ShareApiMutationAuthorizationTest.php packages/Mothership/DAM/tests/Feature/Api/TagApiTest.php

      - name: Check DAM directory tests
        if: ${{ !cancelled() }}
        run: vendor/bin/pest --colors=always packages/Mothership/DAM/tests/Feature/DeleteDirectoryTransactionTest.php packages/Mothership/DAM/tests/Feature/DirectoryAncestorPathsTest.php packages/Mothership/DAM/tests/Feature/DirectoryAssetCountRollupTest.php packages/Mothership/DAM/tests/Feature/DirectoryAssetCountsEndpointTest.php packages/Mothership/DAM/tests/Feature/DirectoryAutoGrantTest.php packages/Mothership/DAM/tests/Feature/DirectoryGrantedIdsResponseTest.php packages/Mothership/DAM/tests/Feature/DirectoryInheritChildrenTest.php packages/Mothership/DAM/tests/Feature/DirectoryMassDestroyTest.php packages/Mothership/DAM/tests/Feature/DirectorySearchTest.php packages/Mothership/DAM/tests/Feature/DirectoryTest.php packages/Mothership/DAM/tests/Feature/DirectoryTreeIntegrityTest.php packages/Mothership/DAM/tests/Feature/DirectoryTreeShowAssetsTest.php packages/Mothership/DAM/tests/Feature/DirectoryTreeAssetAccessTest.php packages/Mothership/DAM/tests/Feature/LibraryStructuralDirectoriesTest.php packages/Mothership/DAM/tests/Unit/AttemptDirectoryTest.php packages/Mothership/DAM/tests/Unit/DirectoryModelTest.php packages/Mothership/DAM/tests/Unit/DirectoryPermissionServiceTest.php packages/Mothership/DAM/tests/Unit/DirectoryRepositorySearchTest.php

      - name: Check DAM access lists (sharing slice 1)
        if: ${{ !cancelled() }}
        run: vendor/bin/pest --colors=always packages/Mothership/DAM/tests/Feature/Access/AccessListReaderTest.php packages/Mothership/DAM/tests/Feature/Access/AccessListRebuildTest.php packages/Mothership/DAM/tests/Feature/Access/AccessSwitchTest.php packages/Mothership/DAM/tests/Feature/Access/AccessRebuildSnapshotTest.php packages/Mothership/DAM/tests/Feature/Access/AccessModelRowLockTest.php packages/Mothership/DAM/tests/Feature/Access/ShareLinksForEveryoneTest.php

      - name: Check DAM sharing dialog and cascade (sharing slice 3)
        if: ${{ !cancelled() }}
