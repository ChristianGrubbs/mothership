# =============================================================================
# Mothership Docker Compose — Development Stack (builds from this checkout)
# =============================================================================
#
# For contributors. The working tree is bind-mounted, so edits are live and
# Composer dependencies are installed into ./vendor on first boot.
#
# Defaults: Nginx + PHP-FPM web stack, PostgreSQL 16 database
#
# Services:
#   mothership-nginx        — Nginx reverse proxy (serves static files, proxies PHP)
#   mothership-fpm          — PHP 8.4 FPM (application server)
#   mothership-q            — Queue worker (system, completeness, default)
#   mothership-scheduler    — Laravel scheduler (cron replacement)
#   mothership-pgsql        — PostgreSQL 16 (profile: pgsql, default)
#   mothership-mysql        — MySQL 8.0 (profile: mysql)
#   mothership-redis        — Redis 7.2 (cache + queue backend)
#   mothership-elasticsearch — Elasticsearch 8.17 (product search)
#   mothership-mailpit      — Mailpit (local email testing)
#
# Quick start:
#   cp .env.docker .env
#   docker compose -f compose.dev.yaml up -d
#   # First boot installs Composer dependencies, then http://localhost:8000/admin
#
# Make it the default for this checkout:
#   COMPOSE_FILE=compose.dev.yaml
#
# ─── Web server: Nginx (default) or Apache ──────────────────────────
#   docker compose -f compose.dev.yaml -f compose.dev.apache.yaml up -d
#
# ─── Database: PostgreSQL (default) or MySQL ────────────────────────
# Selected by COMPOSE_PROFILES in .env — only the chosen engine starts.
#
#   PostgreSQL          MySQL
#   ----------          -----
#   COMPOSE_PROFILES=pgsql       COMPOSE_PROFILES=mysql
#   DB_CONNECTION=pgsql          DB_CONNECTION=mysql
#   DB_HOST=mothership-pgsql         DB_HOST=mothership-mysql
#   DB_PORT=5432                 DB_PORT=3306
#
# Switching engines on an existing install needs a fresh database — the
# data is not migrated between them.
#
# Port conflicts? Override FORWARD_* variables in .env
#
# =============================================================================

# ─── Shared configuration (reused via YAML anchors) ─────────────────
x-app-environment: &app-environment
  APP_URL: "${APP_URL:-http://localhost:${APP_PORT:-8000}}"
  DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
  DB_HOST: "${DB_HOST:-mothership-pgsql}"
  DB_PORT: "${DB_PORT:-5432}"
  REDIS_HOST: mothership-redis
  REDIS_PORT: 6379
  ELASTICSEARCH_HOST: mothership-elasticsearch:9200
  MAIL_HOST: mothership-mailpit
  MAIL_PORT: 1025

# required: false keeps the engine that is not in COMPOSE_PROFILES from being
# pulled in as an implicit dependency — only the selected one is health-gated.
x-app-depends: &app-depends
  mothership-pgsql:
    condition: service_healthy
    required: false
  mothership-mysql:
    condition: service_healthy
    required: false
  mothership-redis:
    condition: service_healthy
  mothership-elasticsearch:
    condition: service_healthy

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  mothership-nginx:
    build:
      context: .
      dockerfile: dockerfiles/nginx.Dockerfile
    volumes:
      - .:/var/www/html:ro
    ports:
      - "${APP_PORT:-8000}:80"
    restart: unless-stopped
    depends_on:
      mothership-fpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/robots.txt", "-o", "/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # PHP-FPM Application Server
  # ---------------------------------------------------------------------------
  mothership-fpm:
    build:
      context: .
      dockerfile: dockerfiles/fpm.Dockerfile
      args:
        HOST_UID: "${HOST_UID:-33}"
        HOST_GID: "${HOST_GID:-33}"
        INSTALL_COVERAGE_EXTENSION: "${INSTALL_COVERAGE_EXTENSION:-true}"
    volumes:
      - .:/var/www/html
      - ./dockerfiles/php-dev.ini:/usr/local/etc/php/conf.d/zz-mothership-dev.ini:ro
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
      COMPOSER_INSTALL_ARGS: "${COMPOSER_INSTALL_ARGS-}"
      MOTHERSHIP_SKIP_MIGRATIONS: "${MOTHERSHIP_SKIP_MIGRATIONS:-false}"
    depends_on:
      <<: *app-depends
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Queue Worker (system, completeness, default)
  # ---------------------------------------------------------------------------
  mothership-q:
    build:
      context: .
      dockerfile: dockerfiles/q.Dockerfile
      args:
        HOST_UID: "${HOST_UID:-33}"
        HOST_GID: "${HOST_GID:-33}"
    volumes:
      - .:/var/www/html
      - ./dockerfiles/php-dev.ini:/usr/local/etc/php/conf.d/zz-mothership-dev.ini:ro
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
      QUEUE_NAMES: "webhooks,system,completeness,default"
    depends_on:
      <<: *app-depends
      mothership-fpm:
        condition: service_healthy
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Dedicated Panorama Queue Worker (long retry_after connection)
  # ---------------------------------------------------------------------------
  mothership-panorama-q:
    build:
      context: .
      dockerfile: dockerfiles/q.Dockerfile
      args:
        HOST_UID: "${HOST_UID:-33}"
        HOST_GID: "${HOST_GID:-33}"
    volumes:
      - .:/var/www/html
      - ./dockerfiles/php-dev.ini:/usr/local/etc/php/conf.d/zz-mothership-dev.ini:ro
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
      QUEUE_WORKER_CONNECTION: panorama
    depends_on:
      <<: *app-depends
      mothership-fpm:
        condition: service_healthy
    logging: *default-logging

  mothership-stylepress-q:
    build:
      context: .
      dockerfile: dockerfiles/fpm.Dockerfile
      args:
        HOST_UID: "${HOST_UID:-33}"
        HOST_GID: "${HOST_GID:-33}"
    entrypoint: ["php", "artisan", "queue:work", "database", "--queue=stylepress", "--timeout=80", "--tries=0", "--sleep=3", "--max-time=3600"]
    user: "${HOST_UID:-33}:${HOST_GID:-33}"
    volumes:
      - .:/var/www/html
      - ${STYLEPRESS_HIGGSFIELD_SESSION_DIR:-./storage/app/private/higgsfield-session}:/var/lib/mothership/.config/higgsfield
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
    depends_on:
      <<: *app-depends
      mothership-fpm:
        condition: service_healthy
    logging: *default-logging

  mothership-vectorization-q:
    build:
      context: .
      dockerfile: dockerfiles/q.Dockerfile
      args:
        HOST_UID: "${HOST_UID:-33}"
        HOST_GID: "${HOST_GID:-33}"
    volumes:
      - .:/var/www/html
      - ./dockerfiles/php-dev.ini:/usr/local/etc/php/conf.d/zz-mothership-dev.ini:ro
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
      QUEUE_WORKER_CONNECTION: vectorization
    depends_on:
      <<: *app-depends
      mothership-fpm:
        condition: service_healthy
    logging: *default-logging

  mothership-ai-index-q:
    build:
      context: .
      dockerfile: dockerfiles/q.Dockerfile
      args:
        HOST_UID: "${HOST_UID:-33}"
        HOST_GID: "${HOST_GID:-33}"
    volumes:
      - .:/var/www/html
      - ./dockerfiles/php-dev.ini:/usr/local/etc/php/conf.d/zz-mothership-dev.ini:ro
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
      QUEUE_WORKER_CONNECTION: ai-index
    depends_on:
      <<: *app-depends
      mothership-fpm:
        condition: service_healthy
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Scheduler (replaces cron — runs schedule:work)
  # ---------------------------------------------------------------------------
  mothership-scheduler:
    build:
      context: .
      dockerfile: dockerfiles/q.Dockerfile
      args:
        HOST_UID: "${HOST_UID:-33}"
        HOST_GID: "${HOST_GID:-33}"
    entrypoint: ["/var/www/html/dockerfiles/scheduler-entrypoint.sh"]
    volumes:
      - .:/var/www/html
      - ./dockerfiles/php-dev.ini:/usr/local/etc/php/conf.d/zz-mothership-dev.ini:ro
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
    depends_on:
      <<: *app-depends
      mothership-fpm:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---------------------------------------------------------------------------
  # MySQL 8.0 — starts only with COMPOSE_PROFILES=mysql
  # ---------------------------------------------------------------------------
  mothership-mysql:
    image: mysql:8.0.36-debian
    profiles: ["mysql"]
    volumes:
      - mothership-mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_DATABASE:-mothership}
      MYSQL_USER: ${DB_USERNAME:-mothership}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --log-bin-trust-function-creators=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — starts only with COMPOSE_PROFILES=pgsql (default)
  # ---------------------------------------------------------------------------
  mothership-pgsql:
    image: postgres:16-alpine
    profiles: ["pgsql"]
    volumes:
      - mothership-pgsql-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${FORWARD_PGSQL_PORT:-5432}:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mothership}
      POSTGRES_USER: ${DB_USERNAME:-mothership}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mothership} -d ${DB_DATABASE:-mothership}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Redis 7.2 (cache + queue backend)
  # ---------------------------------------------------------------------------
  mothership-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - mothership-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ---------------------------------------------------------------------------
  # Elasticsearch 8.17 (product + category search)
  # ---------------------------------------------------------------------------
  mothership-elasticsearch:
    image: elasticsearch:8.17.0
    # Stable hostname so InetAddress.getLocalHost() resolves before
    # Log4j is initialized. Without it, the random container ID is
    # picked as hostname and an absent /etc/hosts entry crashes ES
    # at boot with "UnknownHostException: <id>".
    hostname: mothership-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - node.name=mothership-elasticsearch
      - cluster.name=mothership
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.routing.allocation.disk.watermark.low=${ELASTICSEARCH_DISK_WATERMARK_LOW:-90%}
      - cluster.routing.allocation.disk.watermark.high=${ELASTICSEARCH_DISK_WATERMARK_HIGH:-95%}
      - cluster.routing.allocation.disk.watermark.flood_stage=${ELASTICSEARCH_DISK_WATERMARK_FLOOD_STAGE:-97%}
    volumes:
      - mothership-elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:${FORWARD_ES_PORT:-9200}:9200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Mailpit (local SMTP + web UI for email testing)
  # ---------------------------------------------------------------------------
  mothership-mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORWARD_MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  mothership-pgsql-data:
  mothership-mysql-data:
  mothership-redis-data:
  mothership-elasticsearch-data:
