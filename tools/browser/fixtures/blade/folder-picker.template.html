
    <div v-if="open" class="fixed inset-0 z-[10010] flex items-center justify-center" data-folder-picker>

        <div class="absolute inset-0 bg-black/50" @click="$emit('close')"></div>

        <div
            ref="dialog"
            tabindex="-1"
            role="dialog"
            aria-modal="true"
            :aria-labelledby="'dam-folder-picker-title-' + tabId"
            class="relative bg-white dark:bg-cherry-900 rounded-xl shadow-2xl w-[360px] max-w-[calc(100vw-2rem)] h-[520px] max-h-[calc(100dvh-2rem)] flex flex-col focus:outline-none"
            @keydown.tab="trapFocus"
            @keydown.esc="onEscape"
        >

            <div class="flex items-center justify-between gap-3 px-5 py-4 border-b dark:border-cherry-800">
                <h3 v-if="title" :id="'dam-folder-picker-title-' + tabId" class="text-base font-semibold text-gray-800 dark:text-white truncate" v-text="title"></h3>
                <h3 v-else :id="'dam-folder-picker-title-' + tabId" class="text-base font-semibold text-gray-800 dark:text-white truncate">
                    Select Destination                </h3>
                <div class="flex items-center gap-2 shrink-0">

                    <v-dam-explorer-view-toggle :model-value="viewMode" @update:model-value="setView"></v-dam-explorer-view-toggle>
                    <button type="button" aria-label="Cancel" @click="$emit('close')" class="icon-cancel text-xl text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white transition"></button>
                </div>
            </div>

            <div class="flex items-center gap-1 px-5 py-2.5 text-sm flex-wrap border-b dark:border-cherry-800 min-h-[40px]">
                <template v-for="(crumb, i) in breadcrumb" :key="crumb.id">
                    <button
                        class="text-gray-500 dark:text-gray-400 hover:text-primary-600 dark:hover:text-primary-400 transition"
                        :class="{ 'font-semibold text-gray-800 dark:text-white': i === breadcrumb.length - 1 }"
                        @click="navigateTo(i)"
                    >{{ crumb.name }}</button>
                    <span v-if="i < breadcrumb.length - 1" class="text-gray-500 dark:text-gray-400 mx-0.5">/</span>
                </template>
            </div>

            <div class="px-3 py-2 border-b dark:border-cherry-800">
                <div class="relative">
                    <input
                        ref="search"
                        v-model="query"
                        type="text"
                        class="block w-full rounded-lg border dark:border-gray-500 bg-white dark:bg-cherry-900 py-1.5 pl-3 pr-10 text-sm leading-6 text-gray-600 dark:text-gray-300 transition hover:border-gray-400 dark:hover:border-gray-400 focus:border-gray-400 dark:focus:border-gray-400 outline-none"
                        placeholder="Search directories..."
                        autocomplete="off"
                        @keydown.esc="clearQuery"
                    />
                    <span v-if="! searchLoading" class="icon-search pointer-events-none absolute right-2.5 top-2 flex items-center text-2xl text-gray-400"></span>
                    <svg v-else class="animate-spin h-4 w-4 text-primary-600 absolute right-3 top-2.5 pointer-events-none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                    </svg>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto px-3 py-2">
                <div v-if="loading || searchLoading" class="flex items-center justify-center h-32">
                    <span class="icon-spinner animate-spin text-2xl text-primary-500"></span>
                </div>

                <template v-else-if="isSearching">
                    <p v-if="visibleSearchResults.length === 0" class="flex items-center justify-center h-32 text-sm text-gray-400 dark:text-gray-500">
                        No matches                    </p>

                    <template v-else-if="viewMode === 'list'">
                        <button
                            v-for="result in visibleSearchResults"
                            :key="result.id"
                            class="flex items-center gap-3 w-full px-3 py-2 rounded-lg text-left hover:bg-primary-50 dark:hover:bg-cherry-800 transition"
                            @click="selectSearchResult(result)"
                        >
                            <i class="icon-dam-folder text-2xl text-primary-400 dark:text-primary-500 shrink-0"></i>
                            <span class="flex flex-col min-w-0">
                                <span class="text-sm text-gray-700 dark:text-gray-200 truncate">{{ result.name }}</span>
                                <span v-if="result.breadcrumb" class="text-xs text-gray-400 dark:text-gray-500 break-all leading-tight">{{ result.breadcrumb }}</span>
                            </span>
                        </button>
                    </template>

                    <div v-else class="grid grid-cols-3 gap-2">
                        <button
                            v-for="result in visibleSearchResults"
                            :key="result.id"
                            class="flex flex-col items-center gap-1.5 p-3 rounded-lg hover:bg-primary-50 dark:hover:bg-cherry-800 transition"
                            :title="result.breadcrumb || result.name"
                            @click="selectSearchResult(result)"
                        >
                            <i class="icon-dam-folder text-4xl text-primary-400 dark:text-primary-500"></i>
                            <span class="text-xs text-gray-700 dark:text-gray-200 truncate w-full text-center">{{ result.name }}</span>
                        </button>
                    </div>
                </template>

                <template v-else>

                                        <div v-if="currentDirId" class="mb-2">
                        <button
                            v-if="! creating.open"
                            type="button"
                            @click="openCreate"
                            class="flex items-center gap-3 w-full px-3 py-2 rounded-lg text-left text-sm font-medium text-primary-600 dark:text-primary-400 hover:bg-primary-50 dark:hover:bg-cherry-800 transition"
                        >
                            <i class="icon-dam-add-folder text-2xl shrink-0"></i>
                            <span class="truncate">New Folder</span>
                        </button>

                        <div v-else class="flex items-center gap-2 px-2 py-1.5 rounded-lg border border-primary-300 dark:border-primary-600 bg-primary-50/50 dark:bg-cherry-800">
                            <i class="icon-dam-folder text-2xl text-primary-400 dark:text-primary-500 shrink-0"></i>
                            <input
                                ref="createInput"
                                v-model="creating.name"
                                type="text"
                                class="flex-1 min-w-0 bg-transparent text-sm text-gray-700 dark:text-gray-200 outline-none placeholder:text-gray-400"
                                placeholder="Folder name"
                                autocomplete="off"
                                @keydown.enter.prevent="submitCreate"
                                @keydown.esc.prevent="cancelCreate"
                            />
                            <button
                                type="button"
                                @click="submitCreate"
                                :disabled="creating.loading || ! creating.name.trim()"
                                class="shrink-0 flex items-center justify-center w-7 h-7 rounded-md text-white bg-primary-600 hover:bg-primary-700 disabled:opacity-40 disabled:cursor-not-allowed transition"
                                :aria-label="'New Folder'"
                            >
                                <svg v-if="! creating.loading" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                                </svg>
                                <svg v-else class="animate-spin w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                                </svg>
                            </button>
                            <button
                                type="button"
                                @click="cancelCreate"
                                :disabled="creating.loading"
                                class="shrink-0 flex items-center justify-center w-7 h-7 rounded-md text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white disabled:opacity-40 transition"
                            >
                                <span class="icon-cancel text-xl"></span>
                            </button>
                        </div>

                        <p v-if="creating.error" class="mt-1 px-1 text-xs text-red-500 dark:text-red-400" v-text="creating.error"></p>
                    </div>
                    
                    <p v-if="visibleDirs.length === 0" class="flex items-center justify-center h-32 text-sm text-gray-400 dark:text-gray-500">
                        No directories found.                    </p>

                    <template v-else-if="viewMode === 'list'">
                        <button
                            v-for="dir in visibleDirs"
                            :key="dir.id"
                            class="flex items-center gap-3 w-full px-3 py-2 rounded-lg text-left text-sm text-gray-700 dark:text-gray-200 hover:bg-primary-50 dark:hover:bg-cherry-800 transition"
                            :class="{ 'ring-2 ring-inset ring-primary-500 bg-primary-50 dark:bg-cherry-800': dir.id === selectedChildId }"
                            @click="navigateInto(dir)"
                        >
                            <i class="icon-dam-folder text-2xl text-primary-400 dark:text-primary-500 shrink-0"></i>
                            <span class="truncate flex-1">{{ dir.name }}</span>
                            <i v-if="dir.id === selectedChildId" class="icon-checkbox-check text-primary-600 dark:text-primary-400 text-lg shrink-0"></i>
                            <i v-else class="icon-chevron-right text-gray-300 dark:text-gray-600 text-lg shrink-0"></i>
                        </button>
                    </template>

                    <div v-else class="grid grid-cols-3 gap-2">
                        <button
                            v-for="dir in visibleDirs"
                            :key="dir.id"
                            class="flex flex-col items-center gap-1.5 p-3 rounded-lg hover:bg-primary-50 dark:hover:bg-cherry-800 transition"
                            :class="{ 'ring-2 ring-inset ring-primary-500 bg-primary-50 dark:bg-cherry-800': dir.id === selectedChildId }"
                            :title="dir.name"
                            @click="navigateInto(dir)"
                        >
                            <i class="icon-dam-folder text-4xl text-primary-400 dark:text-primary-500"></i>
                            <span class="text-xs text-gray-700 dark:text-gray-200 truncate w-full text-center">{{ dir.name }}</span>
                        </button>
                    </div>
                </template>
            </div>

            <p v-if="insideExcluded" class="px-5 pb-2 text-xs text-red-600 dark:text-red-400" role="alert" data-picker-invalid>A folder cannot go into itself or one of its own subfolders.</p>
            <div class="flex items-center justify-end gap-3 px-5 py-4 border-t dark:border-cherry-800">
                <button
                    @click="$emit('close')"
                    class="px-4 py-2 text-sm text-gray-600 dark:text-gray-300 border border-gray-300 dark:border-cherry-700 rounded-lg hover:bg-gray-50 dark:hover:bg-cherry-800 transition"
                >
                    Cancel                </button>
                <button
                    @click="confirm()"
                    :disabled="! canConfirm"
                    class="px-4 py-2 text-sm font-medium bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition disabled:opacity-40 disabled:cursor-not-allowed"
                >
                    Select Here                </button>
            </div>
        </div>
    </div>
