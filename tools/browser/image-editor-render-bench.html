<!doctype html>
<meta charset="utf-8" />
<title>Image editor render bench</title>
<!--
  Serve the repository root with a static server and open
  /tools/browser/image-editor-render-bench.html?w=4000&h=3000&n=12
  Results land in window.benchResults and in the <pre> below.
  See docs/ops/image-editor-performance.md for recorded numbers.
-->
<canvas id="c"></canvas>
<pre id="out">running…</pre>
<script>
    // Hidden tabs defer Image.decode(); wait for load instead so the bench
    // completes when the page is not the visible tab.
    HTMLImageElement.prototype.decode = function () {
        return new Promise((resolve, reject) => {
            if (this.complete && this.naturalWidth) return resolve();
            this.addEventListener("load", () => resolve(), { once: true });
            this.addEventListener("error", () => reject(Error("load failed")), { once: true });
        });
    };
</script>
<script type="module">
    const base = "../../packages/Mothership/DAM/src/Resources/assets/js/image/";
    const { renderDocument } = await import(base + "renderer.mjs");
    const { createDocument } = await import(base + "document.mjs");
    const q = new URLSearchParams(location.search);
    const W = +q.get("w") || 4000, H = +q.get("h") || 3000, N = +q.get("n") || 12;
    const src = document.createElement("canvas");
    src.width = W;
    src.height = H;
    const sc = src.getContext("2d"), grad = sc.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, "#f59e0b");
    grad.addColorStop(1, "#1d4ed8");
    sc.fillStyle = grad;
    sc.fillRect(0, 0, W, H);
    for (let i = 0; i < 400; i++) {
        sc.fillStyle = `hsl(${(i * 7) % 360} 70% 50%)`;
        sc.beginPath();
        sc.arc(Math.random() * W, Math.random() * H, 20 + Math.random() * 200, 0, 7);
        sc.fill();
    }
    const url = URL.createObjectURL(await new Promise((r) => src.toBlob(r, "image/png")));
    const resolve = () => url;
    const stats = (a) => {
        const s = [...a].sort((x, y) => x - y), at = (p) => s[Math.floor(s.length * p)];
        return { median: +at(0.5).toFixed(1), iqr: +(at(0.75) - at(0.25)).toFixed(1), min: +s[0].toFixed(1), max: +s.at(-1).toFixed(1), n: s.length };
    };
    const scenarios = {
        identity: (d) => d,
        annotate: (d) => { d.annotations.push({ id: "a", type: "arrow", x: 100, y: 100, width: 800, height: 400, color: "#e11d48", size: 8, text: "" }); return d; },
        brightness: (d) => { d.adjustments.brightness = 20; return d; },
        background: (d) => { Object.assign(d.background, { enabled: true, type: "gradient", padding: 80, shadow: 30, radius: 24 }); return d; },
        sharpen: (d) => { d.adjustments.sharpen = 40; return d; },
    };
    const canvas = document.getElementById("c"), results = {};
    for (const [name, mutate] of Object.entries(scenarios)) {
        const doc = mutate(createDocument({ base: "b", width: W, height: H })), times = [];
        await renderDocument({ doc, resolve, canvas });
        for (let i = 0; i < N; i++) {
            const t = performance.now();
            await renderDocument({ doc, resolve, canvas });
            times.push(performance.now() - t);
        }
        results[name] = stats(times);
    }
    window.benchResults = results;
    document.getElementById("out").textContent = JSON.stringify({ W, H, results }, null, 1);
</script>
