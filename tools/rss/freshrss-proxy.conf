
server {
    listen 80;
    server_name _;

    location /mothership-api/ {
        # Resolve the adapter per request through Docker's DNS. A literal proxy_pass host
        # is resolved once at nginx start, so every deploy.py run (new container, new IP)
        # left this path at 502 until `nginx -s reload` (2026-10-18).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mothership_rss_api http://mothership-rss-api:8788;
        rewrite ^/mothership-api/(.*)$ /$1 break;
        proxy_pass $mothership_rss_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location / {
        proxy_pass http://freshrss_server_1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
